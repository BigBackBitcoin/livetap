name: mobile

# Builds the two native LIVETAP mobile projects on GitHub-hosted runners. This exists because the
# development host has neither an Android SDK/JDK nor Xcode: CI is the only place in this project
# where the native code is actually compiled.
#
# Both jobs produce UNSIGNED builds only:
# - Android: assembleDebug (debug-signed with the SDK's throwaway key) -> APK artifact.
# - iOS: xcodebuild for the simulator with CODE_SIGNING_ALLOWED=NO -> no artifact, compile-only.
#
# Signed/distributable builds need credentials that MUST NOT live in this repository:
#   Android  -> upload keystore + key/store passwords, then `bundleRelease` for an AAB.
#   iOS      -> Apple Developer Program membership, distribution certificate, provisioning
#               profile, and an App Store Connect API key for upload.
# Those go in GitHub encrypted secrets when they exist, and a separate release workflow consumes
# them. No secrets are referenced here.
#
# The native LiveStream code does NOT live in apps/mobile: it is the workspace package
# packages/capacitor-live-stream (Swift under ios/Sources, Kotlin under android/src/main), which
# `cap sync` discovers and wires into both native projects. The `packages/**` path filter below
# already covers it, so no extra trigger is needed — but a change there is a change to the native
# build, which is why that filter must stay.
#
# See docs/release/GOOGLE_PLAY_READINESS.md and docs/release/APP_STORE_READINESS.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

# Nothing in this workflow writes to the repository or to any package registry.
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Capacitor 7 is pinned because @capacitor/cli@8 requires Node >= 22 and the project's
  # development host is on Node 20.11 (ADR-004 / docs/architecture/MOBILE_ARCHITECTURE.md).
  # CI matches the development host so a green CI means a reproducible local build.
  NODE_VERSION: '20.19'

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # JDK 21, not 17. Capacitor 7 generates apps/mobile/android/app/capacitor.build.gradle with
      # sourceCompatibility/targetCompatibility = VERSION_21, and that file is regenerated by
      # `cap sync`, so it cannot be edited down. JDK 17 fails the compile.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install workspace dependencies
        run: npm ci

      # The web app is the WebView payload. If apps/web has no build yet this step fails loudly
      # rather than silently shipping apps/mobile/www (the placeholder shell), which would produce
      # an APK that installs and shows nothing useful.
      - name: Build web app
        run: npm run build:web

      # webDir currently points at the placeholder apps/mobile/www. Once apps/web/dist is the real
      # payload, change webDir to '../web/dist' in apps/mobile/capacitor.config.ts and delete this
      # guard. Until then, make the situation visible in the log instead of hiding it.
      - name: Report which webDir will be synced
        working-directory: apps/mobile
        run: node -e "const c=require('fs').readFileSync('capacitor.config.ts','utf8');const m=c.match(/webDir:\s*'([^']+)'/);console.log('webDir =',m&&m[1]);"

      - name: Capacitor sync (android)
        working-directory: apps/mobile
        run: npx cap sync android

      # Guards the regression that motivated packages/capacitor-live-stream: if the plugin package
      # stops being discovered (a bad `exports` map, a dropped dependency, a renamed capacitor
      # block), sync still succeeds and the APK still builds — it just silently has no LiveStream.
      # Fail here instead, where the cause is obvious.
      - name: Assert LiveStream plugin is registered
        working-directory: apps/mobile
        run: |
          node -e "
          const p=require('./android/app/src/main/assets/capacitor.plugins.json');
          const hit=p.find(e=>e.pkg==='@livetap/capacitor-live-stream');
          if(!hit) { console.error('capacitor.plugins.json:',JSON.stringify(p,null,2)); throw new Error('LiveStream plugin not registered for android'); }
          console.log('registered:',hit.classpath);
          "

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: livetap-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Play requires an AAB for new apps, and an AAB release build requires the upload keystore,
      # so it is not built here. `bundleRelease` is the command; the credentials are the blocker.
      - name: Note on AAB
        if: always()
        run: echo "Release AAB (./gradlew bundleRelease) requires the upload keystore - BLOCKED_EXTERNAL_DEPENDENCY. See docs/release/GOOGLE_PLAY_READINESS.md items G7/G8/G27."

  ios:
    name: iOS simulator build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Capacitor sync (ios)
        working-directory: apps/mobile
        run: npx cap sync ios

      # The iOS half of the same guard. `packageClassList` is the ONLY thing that makes an iOS
      # Capacitor plugin reachable from JavaScript (CapacitorBridge.registerPlugins instantiates
      # nothing else), and it is regenerated on every sync — so assert it rather than assume it.
      - name: Assert LiveStream plugin is registered
        working-directory: apps/mobile
        run: |
          node -e "
          const c=require('./ios/App/App/capacitor.config.json');
          if(!(c.packageClassList||[]).includes('LiveStreamPlugin')) { console.error('packageClassList:',c.packageClassList); throw new Error('LiveStreamPlugin missing from packageClassList'); }
          const fs=require('fs'); const podfile=fs.readFileSync('./ios/App/Podfile','utf8');
          if(!podfile.includes(\"pod 'LivetapCapacitorLiveStream'\")) throw new Error('Podfile is missing the LivetapCapacitorLiveStream pod');
          console.log('LiveStreamPlugin in packageClassList and pod in Podfile');
          "

      # CocoaPods is preinstalled on GitHub's macOS images. HaishinKit 2.0.9 is the newest version
      # published to CocoaPods trunk; 2.1+/2.2+ are Swift Package Manager only (see the note in
      # apps/mobile/ios/App/Podfile).
      - name: pod install
        working-directory: apps/mobile/ios/App
        run: pod install --repo-update

      - name: Show toolchain
        run: |
          xcodebuild -version
          pod --version

      # Compile-only, simulator destination, signing disabled. This proves the Swift/ObjC sources
      # and the pod graph build; it cannot prove camera capture, RTMP behaviour, background audio
      # or thermal throttling, all of which need a physical device.
      - name: xcodebuild (simulator, no signing)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Note on signed builds
        if: always()
        run: echo "Signed device/TestFlight builds require an Apple Developer Program membership, a distribution certificate, a provisioning profile and an App Store Connect API key, injected as encrypted GitHub secrets - BLOCKED_EXTERNAL_DEPENDENCY. See docs/release/APP_STORE_READINESS.md items A1/A24/A25."
