<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIVETAP</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #0b0b0f; color: #e8e8ef;
             font: 16px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; }
      main { max-width: 40rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .75rem; letter-spacing: .02em; }
      p { margin: 0 0 .5rem; color: #a6a6b8; }
      code { background: #17171f; padding: .15em .4em; border-radius: .25em; color: #cfcfe0; }
    </style>
  </head>
  <body>
    <main>
      <h1>LIVETAP renderer not built</h1>
      <p>This is a placeholder so the Electron shell and the packaging pipeline can be exercised.</p>
      <p>Build the real UI with <code>npm run build:renderer -w @livetap/desktop</code>, which writes
        the React app into <code>apps/desktop/dist/renderer</code>.</p>
    </main>
  </body>
</html>
