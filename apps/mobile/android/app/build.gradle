apply plugin: 'com.android.application'
// No Kotlin plugin here any more. LiveStreamPlugin and LiveForegroundService were the only Kotlin
// in this module and they now live in packages/capacitor-live-stream, whose own android/build.gradle
// applies 'org.jetbrains.kotlin.android'. MainActivity.java is all that is left, and it is Java.

android {
    namespace "app.livetap.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.livetap.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Left off until a device-tested ProGuard configuration exists for RootEncoder's
            // MediaCodec/JNI paths. Turning this on untested is a classic way to ship a release
            // build that crashes only on real hardware.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signing is BLOCKED_EXTERNAL_DEPENDENCY: it needs an upload keystore that does not
            // exist in this repository and must never be committed. See
            // docs/release/GOOGLE_PLAY_READINESS.md items G8/G27.
        }
        debug {
            // The CI workflow builds only this variant (unsigned, debug-signed by the SDK).
            applicationIdSuffix ""
        }
    }
    packagingOptions {
        resources {
            // RootEncoder (pulled in transitively through the :livetap-capacitor-live-stream
            // module) brings modules that each ship their own license copies.
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // No RootEncoder line here. The encoder is an implementation detail of the LiveStream plugin
    // and is declared by packages/capacitor-live-stream/android/build.gradle; this module gets it on
    // the runtime classpath through the generated
    // `implementation project(':livetap-capacitor-live-stream')` in capacitor.build.gradle.
    // `rootEncoderVersion` stays in variables.gradle because the plugin module reads it from
    // rootProject.ext.

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
