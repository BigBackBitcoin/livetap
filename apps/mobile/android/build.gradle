// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13.0 + Gradle 8.14.3 is the combination validated against compileSdk 36 in
        // docs/research/DESKTOP_MOBILE_STORE_RESEARCH.md section 2.1. Capacitor 7's template ships
        // AGP 8.7.2 / Gradle 8.11.1, which predates stable API 36 support.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // google-services is applied only when a google-services.json exists (see app/build.gradle).
        // LIVETAP ships no Firebase, no push notifications and no analytics in the open-source core.
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // RootEncoder (com.github.pedroSG94.RootEncoder) is published through JitPack.
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
