<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>LIVETAP</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #0b0b0f; color: #f4f4f6; }
      body {
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: grid; place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main { max-width: 30rem; }
      h1 { font-size: 1.375rem; letter-spacing: 0.02em; margin: 0 0 0.75rem; }
      p { margin: 0 0 0.75rem; color: #b6b6c2; }
      code { background: #1b1b24; padding: 0.1em 0.35em; border-radius: 4px; color: #e8e8ef; }
    </style>
  </head>
  <body>
    <main>
      <h1>LIVETAP — placeholder shell</h1>
      <p>
        This page exists only so that <code>npx cap add</code> / <code>cap sync</code> have a
        <code>webDir</code> to copy. It is <strong>not</strong> the LIVETAP UI.
      </p>
      <p>
        Once <code>apps/web/dist</code> is built, set <code>webDir: '../web/dist'</code> in
        <code>apps/mobile/capacitor.config.ts</code> and delete <code>apps/mobile/www/</code>.
      </p>
    </main>
  </body>
</html>
